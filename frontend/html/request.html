<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Producto</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="request-container">
        <h2>Solicitud de Producto</h2>
        <form id="requestForm">
            <input type="text" id="productId" placeholder="ID del producto" required>
            <input type="number" id="quantity" placeholder="Cantidad" required>
            <textarea id="reason" placeholder="Razón de la solicitud" required></textarea>
            <button type="submit">Solicitar</button>
        </form>
    </div>

    <script src="../js/request.js"></script>
</body>
</html>
